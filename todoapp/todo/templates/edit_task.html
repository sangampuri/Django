<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit task</title>
</head>
<body>
    <div>
        <h1>Edit task</h1>
        {% if error %}
            <p>{{ error }}</p>
        {% endif %}
        <form action="{% url 'edit_task' task.id %}" method="POST">
            {% csrf_token %}
            <label for="title">Title:</label>
            <input type="text" name="title" id="title" value="{{ task.title }}" required>
            <br>
            <label for="description">Description:</label>
            <textarea name="description" id="description" required>{{ task.description }}</textarea>
            <br>
            <label for="is_completed">Completed:</label>
            <input type="checkbox" name="is_completed" id="is_completed" {% if task.is_completed %}checked{% endif %}>
            <br>
            <button type="submit">Save Changes</button>
        </form>
    </div>
</body>
</html>
