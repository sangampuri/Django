<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo app</title>
</head>
<body>
    <div>
        <h1>Todo app</h1>
        <button><a href="{% url 'create_task' %}">Create Task</a></button>
        <table border="1">
            <thead >
                <td >Title</td>
                <td>Description</td>
                <td>Is Completed</td>
                <td>Action</td>
            </thead>
            <tbody>
                {% for task in tasks %}
                <tr>
                    <td>{{task.title}}</td>
                    <td>{{task.description}}</td>
                    <td>{{task.is_completed|yesno:"Completed,Pending"}}</td>
                    <td>
                        <a href="{% url 'edit_task' task.id %}">Edit</a>
                        <a href="{% url 'delete_task' task.id %}">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
