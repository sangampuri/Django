<body>
    <h1>All Students</h1>

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>Action</th>
        </tr>

       {% for student in students %}
<tr>
    <td>{{ student.name }}</td>
    <td>{{ student.email }}</td>
    <td>{{ student.age }}</td>

    <td>
        <a href="{% url 'update_student' student.id %}">Edit</a>

        <a href="{% url 'delete_student' student.id %}">Delete</a>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="4">No students found.</td>
</tr>
{% endfor %}
    </table>
</body>
